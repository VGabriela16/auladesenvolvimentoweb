<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body background="capidastrof.png">
    <h1><big>Area de cadastro!</big></h1><br>
    <form>
        <label><big>Nome completo da sua Capfilha</big></label>
        <input type="text" placeholder="nome"><br><br>

        
        <label><big>conte-nos sobre sua capivara:</big></label>
        <textarea rows="10" cols="30 " maxlength="10000" minlength="5"> </textarea> <br><br>

        <label><big>Peso</big></label>
        <input type="number" placeholder="kg"> <br><br>
        <label><big>altura</big></label>
        <input type="number" placeholder="cm"> 


        <br><br>
        <label><big>qual o motivo da busca de nossa empresa?</big></label>

        <select>
            <option>Cadastro de capivara</option>
            <option>Informações sobre alimentação</option>
            <option>Acompanhamento de saúde</option>
            <option>Segurança e proteção</option>
            <option>Outros</option>
        </select><br><br>
        <label><big>Se sua escolha foi outra:</big></label>
        <textarea rows="10" cols="30 " maxlength="10000" minlength="5"> </textarea> <br><br>
        
    </form>
    
</body>
</html>
